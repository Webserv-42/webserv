<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>webserv — Test Dashboard</title>
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/dashboard/style.css">
</head>
<body>
  <div class="header">
    <h1>webserv — test dashboard</h1>
    <div class="user-tag user-center">
      <span class="user-label">user</span>
      <span class="user-name" id="user-name">unknown</span>
    </div>
    <div class="header-right">
      <span id="server-status" class="status s-pend">server: unknown</span>
      <button class="btn-verify" onclick="checkServer()">check</button>
      <button class="btn-run" onclick="runAll()">run all</button>
      <button class="Btn" onclick="logout()">
        <div class="sign">
          <svg viewBox="0 0 512 512" aria-hidden="true">
            <path d="M377.9 105.9L500.7 228.7c7.2 7.2 11.3 17.1 11.3 27.3s-4.1 20.1-11.3 27.3L377.9 406.1c-6.4 6.4-15 9.9-24 9.9c-18.7 0-33.9-15.2-33.9-33.9l0-62.1-128 0c-17.7 0-32-14.3-32-32l0-64c0-17.7 14.3-32 32-32l128 0 0-62.1c0-18.7 15.2-33.9 33.9-33.9c9 0 17.6 3.6 24 9.9zM160 96L96 96c-17.7 0-32 14.3-32 32l0 256c0 17.7 14.3 32 32 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-64 0c-53 0-96-43-96-96L0 128C0 75 43 32 96 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32z"></path>
          </svg>
        </div>
        <div class="text">Log out</div>
      </button>
    </div>
  </div>

<div class="summary">
  <div class="stat"><div class="stat-num num-total" id="s-total">17</div><div class="stat-label">total tests</div></div>
  <div class="stat"><div class="stat-num num-pass"  id="s-pass">0</div><div class="stat-label">passed</div></div>
  <div class="stat"><div class="stat-num num-fail"  id="s-fail">0</div><div class="stat-label">failed</div></div>
  <div class="stat"><div class="stat-num num-pend"  id="s-pend">17</div><div class="stat-label">pending</div></div>
</div>

<div class="progress"><div class="progress-bar" id="prog"></div></div>

<div class="grid" id="grid"></div>

<script src="/cgi/test.js"></script>
</body>
</html>
