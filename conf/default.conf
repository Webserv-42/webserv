server {
	listen 8080;
	server_name localhost;
	client_max_body_size 1048576;

	# Custom error pages
	error_page 404 /errors/404.html;
	error_page 500 /errors/500.html;

	# Main route — static files
	location / {
		root www;
		index home/index.html;
		autoindex off;
		allowed_methods GET;
	}

	# Dashboard route — force CGI for HTML
	location /dashboard/style.css {
		root www/dashboard/style.css;
		allowed_methods GET;
	}

	location /dashboard {
		return 302 /cgi-bin/dashboard.py;
	}

	location /dashboard/ {
		return 302 /cgi-bin/dashboard.py;
	}

	# Uploads route — accepts POST and DELETE
	location /uploads/ {
		root www/uploads;
		autoindex on;
		allowed_methods GET POST DELETE;
		upload_enable on;
		upload_store www/uploads;
	}

	# Redirect route — test HTTP redirection
	location /old/ {
		return 301 /;
	}

	# CGI route — Python script execution
	location /cgi-bin/ {
		root www/cgi;
		allowed_methods GET POST;
		cgi_extension .py;
		cgi_path /usr/bin/python3;
	}

	# CGI route — Bash script execution
	location /cgi-bash/ {
		root www/cgi;
		allowed_methods GET POST;
		cgi_extension .sh;
		cgi_path /bin/bash;
	}
}
